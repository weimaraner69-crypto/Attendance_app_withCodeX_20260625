name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: attendance_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Python policy dependencies
        run: python3 -m pip install --requirement ci/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Policy check tests
        run: python3 -m unittest ci.test_policy_check

      - name: Supabase migration tests
        run: python3 -m unittest ci.test_supabase_advisor_migrations

      - name: Staff Auth PostgreSQL integration tests
        run: |
          psql --set ON_ERROR_STOP=1 --file ci/test_staff_auth_postgres.sql
          bash ci/test_staff_auth_postgres_concurrency.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: attendance_test

      - name: External API PostgreSQL integration tests
        run: |
          psql --set ON_ERROR_STOP=1 --file ci/test_external_api_rate_limit_postgres.sql
          bash ci/test_external_api_rate_limit_concurrency.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: attendance_test

      - name: Policy check
        run: python3 ci/policy_check.py

      - name: TypeScript tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  review-evidence-gate:
    if: github.event_name == 'pull_request'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Python policy dependencies
        run: python3 -m pip install --requirement ci/requirements.txt

      - name: Require current independent review evidence
        run: python3 ci/policy_check.py --require-review-evidence --pr-number "${{ github.event.pull_request.number }}"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks

      - name: Run gitleaks
        run: gitleaks git --verbose --redact
